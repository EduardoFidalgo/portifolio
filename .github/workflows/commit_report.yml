name: Commit Report (Last 15 days)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: List all repositories (public + private)
        id: repos
        run: |
          curl -s -H "Authorization: token ${{ secrets.PAT }}" \
               "https://api.github.com/user/repos?per_page=200&type=owner" \
               > repos.json

          echo "Repos encontrados:"
          jq '.[].full_name' repos.json

      - name: Setup safe git credentials
        run: |
          git config --global url."https://oauth2:${{ secrets.PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Count commits from last 15 days
        id: counter
        run: |
          DAYS=15
          START_DATE=$(date -d "$DAYS days ago" +"%Y-%m-%d")
          END_DATE=$(date +"%Y-%m-%d")

          echo "Contando commits entre $START_DATE e $END_DATE"

          TOTAL=0
          RESULTS="["

          for FULLNAME in $(jq -r '.[].full_name' repos.json); do
            NAME=$(echo "$FULLNAME" | cut -d'/' -f2)

            echo "Processando: $NAME"

            git clone --quiet https://github.com/$FULLNAME.git
            cd "$NAME"

            COUNT=$(git log --since="$START_DATE" --until="$END_DATE" --pretty=format:"%h" | wc -l)
            TOTAL=$((TOTAL + COUNT))

            RESULTS="$RESULTS {\"repo\":\"$NAME\",\"commits\":$COUNT},"

            cd ..
          done

          RESULTS="${RESULTS::-1}]"

          echo "$RESULTS" > commits_by_repo.json

          echo "{\"start\":\"$START_DATE\",\"end\":\"$END_DATE\",\"total_commits\":$TOTAL,\"repos\":$RESULTS}" > commits.json

          echo "Resultado final:"
          cat commits.json

      - name: Publish JSON to public repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.PAT }}
          publish_dir: .
          publish_branch: main
          external_repository: EduardoFidalgo/commit-stats
