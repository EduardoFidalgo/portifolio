name: Commit Report (Last 15 days)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commits:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch repositories
        run: |
          curl -s \
            -H "Authorization: token ${{ secrets.PAT }}" \
            "https://api.github.com/user/repos?per_page=200&type=owner" \
            > repos.json

      - name: Count commits from API (FAST)
        run: |
          DAYS=15
          SINCE=$(date -d "$DAYS days ago" --iso-8601=seconds)
          UNTIL=$(date --iso-8601=seconds)

          TOTAL=0
          RESULTS="["

          for FULLNAME in $(jq -r '.[].full_name' repos.json); do
            echo "Checking $FULLNAME"

            COUNT=$(curl -s \
              -H "Authorization: token ${{ secrets.PAT }}" \
              "https://api.github.com/repos/$FULLNAME/commits?author=${{ github.actor }}&since=$SINCE&until=$UNTIL&per_page=200" \
              | jq length)

            TOTAL=$((TOTAL + COUNT))
            REPO=$(echo $FULLNAME | cut -d'/' -f2)

            RESULTS="$RESULTS {\"repo\":\"$REPO\",\"commits\":$COUNT},"
          done

          RESULTS="${RESULTS::-1}]"

          echo "{\"total_commits\":$TOTAL,\"repos\":$RESULTS}" > commits.json

      - name: Publish JSON to public repo
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.PAT }}
          publish_dir: .
          publish_branch: main
          external_repository: EduardoFidalgo/commit-stats
